name: Diagnosticar acesso público PcComponentes v3

on:
  push:
    branches: [diag-pccomponentes-access-v3]
    paths:
      - '.github/workflows/diag_pccomponentes_access_v3.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install requests curl_cffi beautifulsoup4
      - name: Aprofundar API pública e readers
        run: |
          python - <<'PY'
          import json, re, time
          from bs4 import BeautifulSoup
          import requests

          PRODUCT='hp-omen-16-am0046np-intel-core-ultra-7-255h-24gb-1tb-ssd-rtx5070-16-pt'
          targets=[
            ('api_root','https://api.pccomponentes.com/'),
            ('api_marketplace','https://api.pccomponentes.com/marketplace/'),
            ('api_marketplace_catalog','https://api.pccomponentes.com/marketplace/catalog'),
            ('api_marketplace_categories','https://api.pccomponentes.com/marketplace/categories'),
            ('api_oauth','https://api.pccomponentes.com/oauth/token'),
            ('api_openapi','https://api.pccomponentes.com/openapi.json'),
            ('api_swagger','https://api.pccomponentes.com/swagger.json'),
            ('api_docs','https://api.pccomponentes.com/docs'),
            ('api_health','https://api.pccomponentes.com/health'),
            ('developers','https://developers.pccomponentes.com/'),
            ('jina_pt_category','https://r.jina.ai/http://www.pccomponentes.pt/categorias/computadores-portateis'),
            ('jina_pt_product','https://r.jina.ai/http://www.pccomponentes.pt/'+PRODUCT),
            ('jina_es_category','https://r.jina.ai/http://www.pccomponentes.com/portatiles'),
            ('jina_alt_category','https://r.jina.ai/https://www.pccomponentes.pt/categorias/computadores-portateis'),
          ]
          headers={'User-Agent':'LapIntel-diagnostic/1.0','Accept':'application/json,text/plain,text/html,*/*'}
          for label,url in targets:
            start=time.time()
            try:
              r=requests.get(url,headers=headers,timeout=15,allow_redirects=True)
              text=r.text or ''
              low=text.lower()
              print(json.dumps({
                'label':label,'status':r.status_code,'final':r.url,'ctype':r.headers.get('content-type',''),
                'bytes':len(r.content),'elapsed_ms':round((time.time()-start)*1000),
                'cloudflare':('just a moment' in low or 'cloudflare' in low or 'challenge-platform' in low),
                'has_portatil':('portatil' in low or 'portátil' in low),'has_rtx5070':'rtx 5070' in low,
                'www_auth':r.headers.get('www-authenticate',''),'allow':r.headers.get('allow','')
              },ensure_ascii=False))
              clean=BeautifulSoup(text,'html.parser').get_text(' ',strip=True) if '<html' in low else text
              print('BODY',label,re.sub(r'\s+',' ',clean)[:1000])
            except Exception as exc:
              print(json.dumps({'label':label,'error':type(exc).__name__+': '+str(exc)[:300]},ensure_ascii=False))
          PY
