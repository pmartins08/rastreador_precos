name: Diagnosticar estrutura pública CHIP7

on:
  push:
    branches: [diag-chip7-structure]
    paths:
      - '.github/workflows/diag_chip7.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install curl_cffi beautifulsoup4
      - name: Testar rotas públicas CHIP7
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from curl_cffi import requests

          targets = [
            ('category','https://chip7.pt/computadores/portateis'),
            ('index-filter','https://chip7.pt/index.php/computadores?category_hierarchicalMenu%5Bcategories.lvl0%5D%5B0%5D=Computadores&category_hierarchicalMenu%5Bcategories.lvl0%5D%5B1%5D=Port%C3%A1teis&category_page=1'),
            ('gaming','https://chip7.pt/computadores/portateis/portateis-gaming'),
            ('robots','https://chip7.pt/robots.txt'),
            ('sitemap','https://chip7.pt/sitemap.xml'),
          ]
          for label,url in targets:
            print('\n===',label,'===')
            try:
              r=requests.get(url,impersonate='chrome131',timeout=12,allow_redirects=True)
              print('status',r.status_code,'final',r.url,'type',r.headers.get('content-type'),'bytes',len(r.content))
              if r.status_code < 400 and 'html' in str(r.headers.get('content-type','')).lower():
                soup=BeautifulSoup(r.text,'html.parser')
                hrefs=sorted({urljoin(r.url,a.get('href')) for a in soup.find_all('a',href=True)})
                productish=[h for h in hrefs if '/produto/' in h.lower() or '/product/' in h.lower()]
                print('hrefs',len(hrefs),'productish',len(productish))
                for h in productish[:20]: print('LINK',h)
                text=soup.get_text(' ',strip=True)
                print('TEXT',text[:1000])
              else:
                print((r.text or '')[:1400].replace('\r',''))
            except Exception as exc:
              print('ERROR',type(exc).__name__,str(exc)[:400])
          PY
