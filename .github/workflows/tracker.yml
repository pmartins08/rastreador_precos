name: Executar Rastreador de Preços

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Consolidar correção V8 antes da execução
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('scraper.py').read_text(encoding='utf-8')
          old = '''    if key == "gpu":\n        detected, gt, gm = gpus(value)\n        if detected:\n            o["gpu_modelos_detectados"] = detected\n            o["gpu_modelo"] = gm\n            o["gpu_tipo"] = gt'''
          new = '''    if key == "gpu":\n        detected, gt, gm = gpus(value)\n        if detected:\n            o["gpu_modelos_detectados"] = detected\n            o["gpu_modelo"] = gm\n            o["gpu_tipo"] = gt\n        elif gt == "integrada":\n            o["gpu_tipo"] = "integrada"'''
          if old in s:
              s = s.replace(old, new, 1)
          Path('scraper.py').write_text(s, encoding='utf-8')
          PY
          python -m py_compile scraper.py

      - name: Smoke tests — V8
        env:
          SMOKE_TEST: '1'
        run: |
          python scraper.py
          python - <<'PY'
          from bs4 import BeautifulSoup
          from scraper import extract

          def page(rows):
              html = '<table>' + ''.join(f'<tr><th>{k}</th><td>{v}</td></tr>' for k, v in rows) + '</table>'
              return BeautifulSoup(html, 'html.parser')

          x = extract('Portátil ASUS Zenbook Ryzen AI 7 445 32GB 1TB AMD Graphics', page([('Placa gráfica', 'AMD Radeon Graphics')]))
          assert x['gpu_modelo'] is None, x
          assert x['gpu_tipo'] == 'integrada', x

          x = extract('Portátil ASUS TUF 16 Ryzen 7 260 32GB 1TB RTX 5070', page([('Placa gráfica', 'NVIDIA GeForce RTX 5070 Laptop GPU'), ('Memória gráfica', '8 GB GDDR7'), ('TGP', '115 W')]))
          assert x['gpu_modelo'] == 'rtx 5070', x
          assert x['vram_gb'] == 8, x
          assert x['tgp_w'] == 115, x

          x = extract('Portátil HP 15 i7-1255U 16GB 512GB', page([('Memória RAM', '16 GB DDR4'), ('Armazenamento', '512 GB SSD')]))
          assert x['gpu_modelo'] is None, x
          assert x['vram_gb'] is None, x
          print('OK: anti-contaminacao GPU/VRAM.')
          PY

      - name: Validar configuração NTFY
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: test -n "$NTFY_TOPIC"

      - name: Executar Scraper V8
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper.py

      - name: Guardar Histórico e limpar workflow temporário
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/tracker.yml')
          w = p.read_text(encoding='utf-8')
          start = '      - name: Consolidar correção V8 antes da execução\n'
          end = '      - name: Smoke tests — V8\n'
          if start in w and end in w:
              before, rest = w.split(start, 1)
              _, after = rest.split(end, 1)
              p.write_text(before + end + after, encoding='utf-8')
          PY
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json scraper.py .github/workflows/tracker.yml
          if git diff --cached --quiet; then
            echo "Sem alterações no histórico/código/workflow."
            exit 0
          fi
          git commit -m "fix: consolidar GPU integrada e limpar workflow [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push
