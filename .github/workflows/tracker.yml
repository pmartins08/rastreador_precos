name: Executar Rastreador de Preços

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Corrigir V8 e revalidar Ouro/Diamante
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('scraper.py').read_text(encoding='utf-8')

          old = 'return list({f"{p[\'loja\']}::{p[\'titulo\']}": p for p in converted})[:limit]'
          new = 'return list({f"{p[\'loja\']}::{p[\'titulo\']}": p for p in converted}.values())[:limit]'
          if old in s:
              s = s.replace(old, new, 1)

          old_cpu = '    p_cpu = weights.get("cpu_base", {"tier_1": 100, "tier_2": 85, "tier_3": 70}).get(spec.get("cpu_modelo"), 50)'
          new_cpu = '''    _cpu_model, cpu_tier, _cpu_class = cpu(spec.get("cpu_modelo", ""))\n    p_cpu = weights.get("cpu_base", {"tier_1": 100, "tier_2": 85, "tier_3": 70}).get(cpu_tier, 50)'''
          if old_cpu in s:
              s = s.replace(old_cpu, new_cpu, 1)

          if 'def value_score(' not in s:
              marker = '\ndef score(spec: dict, price_value: float, weights: dict, settings: dict) -> dict:\n'
              helper = '''\ndef value_score(ranking: float, price_value: float, settings: dict) -> float:\n    raw = (1.30 * ranking) * 0.70 + price_score(price_value, settings) * 0.30\n    return round(max(0.0, min(150.0, raw)), 1)\n\n'''
              if marker in s:
                  s = s.replace(marker, helper + marker, 1)

          s = s.replace(
              'value = round(ranking * 0.70 + price_score(price_value, settings) * 0.30, 1)',
              'value = value_score(ranking, price_value, settings)',
              1,
          )

          old_top = 'top = sorted(((e, k) for k, entries in history["offers"].items() for e in (entries[-1:],)), key=lambda x: x[0].get("value_score", 0), reverse=True)[:8]'
          new_top = 'top = sorted(((entries[-1], k) for k, entries in history["offers"].items() if entries), key=lambda x: x[0].get("value_score", 0), reverse=True)[:8]'
          if old_top in s:
              s = s.replace(old_top, new_top, 1)

          old_keyboard = '''    elif key == "keyboard":\n        kt = norm(value)\n        o["teclado_pt"] = (\n            "nao_pt" if any(x in kt for x in KNPT)\n            else "confirmado" if any(x in kt for x in KPT)\n            else o["teclado_pt"]\n        )'''
          new_keyboard = '''    elif key == "keyboard":\n        kt = norm(value)\n        pt_exact = {"pt", "pt-pt", "portugues", "portuguese", "portugal", "portugues portugal", "portuguese portugal"}\n        o["teclado_pt"] = (\n            "nao_pt" if any(x in kt for x in KNPT)\n            else "confirmado" if kt in pt_exact or bool(re.search(r"\\b(?:pt|pt-pt)\\b", kt))\n            else o["teclado_pt"]\n        )'''
          if old_keyboard in s:
              s = s.replace(old_keyboard, new_keyboard, 1)

          old_return = '''    return o\n\ndef quality(s: dict) -> tuple[float, str]:'''
          new_return = '''    if o.get("teclado_pt") == "desconhecido":\n        nt = norm(page_text)\n        if re.search(r"teclado.{0,80}\\b(?:pt|pt-pt|portugues|portuguese|portugal)\\b", nt):\n            o["teclado_pt"] = "confirmado"\n            o["fontes"]["teclado_pt"] = "contexto_texto"\n        elif re.search(r"teclado.{0,80}\\b(?:espanhol|spanish|frances|french|alemao|german|ingles|english|azerty|qwertz)\\b", nt):\n            o["teclado_pt"] = "nao_pt"\n            o["fontes"]["teclado_pt"] = "contexto_texto"\n    return o\n\ndef quality(s: dict) -> tuple[float, str]:'''
          if old_return in s:
              s = s.replace(old_return, new_return, 1)

          old_unknown = '''        if require_pt and s.get("teclado_pt") == "desconhecido":\n            continue'''
          new_unknown = '''        if require_pt and s.get("teclado_pt") == "desconhecido":\n            loja_stats[loja]["rejeitados"] += 1\n            continue'''
          if old_unknown in s:
              s = s.replace(old_unknown, new_unknown, 1)

          Path('scraper.py').write_text(s, encoding='utf-8')
          PY
          python -m py_compile scraper.py

      - name: Smoke tests — V8
        env:
          SMOKE_TEST: '1'
        run: python scraper.py

      - name: Validar configuração NTFY
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: test -n "$NTFY_TOPIC"

      - name: Executar Scraper V8
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper.py

      - name: Guardar Histórico e correções V8
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json scraper.py
          if git diff --cached --quiet; then
            echo "Sem alterações no histórico/código."
            exit 0
          fi
          git commit -m "fix: melhorar teclado PT e preservar score V8 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push
