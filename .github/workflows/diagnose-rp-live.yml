name: Diagnosticar validação live RP

on:
  push:
    branches: [fix/rp-promo-coverage]
    paths: ['.github/workflows/diagnose-rp-live.yml']

permissions:
  contents: read

jobs:
  diagnose-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Comparar regra configurada com landing
        run: |
          python - <<'PY'
          import json
          import runner
          import promotion_live_guard as live_guard

          tracker = runner.tracker
          config = tracker.load_json(tracker.CONFIG_PATH)
          cat = next(row for row in config['category_urls'] if row['loja'] == 'Radio Popular')
          configured = next(row for row in cat['campaign_urls'] if row['label'] == '50_por_250_set_2026')['promotion']
          route = next(r for r in tracker.discovery_routes(cat, 'Radio Popular') if '50_por_250_set_2026' in str(r.get('label')))
          profile = tracker.profile_order('Radio Popular', 'diag_live')[0]
          response = tracker.requests.get(route['url'], timeout=20, impersonate=profile, headers=tracker.headers(profile), allow_redirects=True)
          parsed = live_guard._active_live_promotions(response.text)
          print('LIVE_CONFIGURED', json.dumps(configured, ensure_ascii=False))
          print('LIVE_PARSED', json.dumps(parsed, ensure_ascii=False))
          print('LIVE_MATCHES', json.dumps([
              {'candidate': promo, 'same': live_guard._same_economic_rule(configured, promo)}
              for promo in parsed
          ], ensure_ascii=False))
          print('LIVE_VERIFIED', json.dumps(live_guard._verified_promotions([configured], parsed), ensure_ascii=False))
          PY
