name: Validar Rastreador

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rastreador-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Compilar módulos
        run: |
          python -m py_compile \
            scraper.py \
            brain_guard.py \
            price_guard.py \
            market_guard.py \
            promotion_guard.py \
            tracker.py \
            runner.py \
            tests/test_brain_guard.py \
            tests/test_price_guard.py \
            tests/test_market_guard.py \
            tests/test_promotion_guard.py \
            tests/test_tracker.py

      - name: Testes unitários
        run: python -m unittest discover -s tests -p 'test_*.py' -v
