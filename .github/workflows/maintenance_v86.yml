name: Migrar V8.6

on:
  push:
    branches: [main]
    paths:
      - 'data/maintenance_v86.py'
      - '.github/workflows/maintenance_v86.yml'

permissions:
  contents: write

concurrency:
  group: rastreador-v86-maintenance
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Corrigir e robustecer migração one-shot
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('data/maintenance_v86.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)',
              'new, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)',
              1,
          )

          lines = text.splitlines()
          for index, line in enumerate(lines):
              if "html = '''<script type=\"application/ld+json\">" in line:
                  payload = line.split("html = '''", 1)[1].rsplit("'''", 1)[0]
                  lines[index] = line[:len(line) - len(line.lstrip())] + 'html = ' + repr(payload)
          text = '\n'.join(lines) + '\n'

          lines = text.splitlines()
          fixed = []
          for index, line in enumerate(lines):
              fixed.append(line)
              if line.strip() == 'tracker = replace_once(':
                  next_line = lines[index + 1].strip() if index + 1 < len(lines) else ''
                  if next_line != 'tracker,':
                      fixed.append('    tracker,')
          text = '\n'.join(fixed) + '\n'

          old = '''        segment_response, _, segment_access = adaptive_fetch(
              route["url"], config, 7, store=store, method="category_variant"
          )'''
          new = '''        access_method = f"category_variant:{route['label']}"
          segment_response, _, segment_access = adaptive_fetch(
              route["url"], config, 7, store=store, method=access_method
          )'''
          text = text.replace(old, new, 1)
          text = text.replace(
              '    for route in discovery_routes(cat, store):',
              '    for route in discovery_routes(cat, store)[:int(settings.get("max_segment_routes", 4))]:',
              1,
          )
          text = text.replace(
              '    pages_fetched = 0\n    while pagination_queue and pages_fetched < max(0, max_pages - 1)',
              '    pages_attempted = 0\n    while pagination_queue and pages_attempted < max(0, max_pages - 1)',
              1,
          )
          text = text.replace(
              '        before_requests = REQUESTS_BY_STORE.get(store, 0)\n        before_candidates = len(candidates)\n        page_response, _, page_access = adaptive_fetch(',
              '        pages_attempted += 1\n        before_requests = REQUESTS_BY_STORE.get(store, 0)\n        before_candidates = len(candidates)\n        page_response, _, page_access = adaptive_fetch(',
              1,
          )
          text = text.replace(
              '            pages_fetched += 1\n            stat["paginas_categoria"] += 1',
              '            stat["paginas_categoria"] += 1',
              1,
          )

          # O GITHUB_TOKEN deste job não tem permissão de workflows. O workflow
          # principal é atualizado diretamente depois desta migração validada.
          workflow_block = '''workflow_path = ROOT / ".github" / "workflows" / "tracker.yml"
          workflow = workflow_path.read_text(encoding="utf-8")
          workflow = workflow.replace("V8.5", "V8.6").replace("v85", "v86")
          workflow_path.write_text(workflow, encoding="utf-8")'''
          if workflow_block not in text:
              raise SystemExit('bloco de workflow principal não encontrado')
          text = text.replace(workflow_block, '# tracker.yml será atualizado externamente após validação', 1)
          text = text.replace(
              'for rel in ("data/maintenance_v86.py", ".github/workflows/maintenance_v86.yml"):',
              'for rel in ("data/maintenance_v86.py",):',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile data/maintenance_v86.py

      - name: Aplicar V8.6
        run: python data/maintenance_v86.py

      - name: Alinhar regressão de probe mode
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_tracker.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          out = []
          inside = False
          inserted = False
          for line in lines:
              if line.lstrip().startswith('def test_persistent_block_enters_probe_mode'):
                  inside = True
              elif inside and line.lstrip().startswith('def test_'):
                  inside = False
              out.append(line)
              if inside and 'b["successes"] = 0' in line and not inserted:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(indent + 'b["contexts"]["category"] = {"chrome131": {"attempts": 12, "successes": 0, "blocks": 12, "errors": 0}}')
                  inserted = True
          if not inserted:
              raise SystemExit('não foi possível atualizar fixture probe mode')
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar V8.6 antes do commit
        run: |
          python -m py_compile scraper.py tracker.py tests/test_tracker.py
          python -m unittest discover -s tests -p 'test_tracker.py' -v

      - name: Persistir código V8.6
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.py scraper.py config/config.json tests/test_tracker.py README.md data/maintenance_v86.py
          git commit -m "feat: evoluir tracker para V8.6 [skip maintenance]"
          git push origin HEAD:main
