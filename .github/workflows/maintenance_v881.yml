name: Maintenance V8.8.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance_v881.yml'
      - '.github/maintenance_v881.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Deduplicar e fechar V8.8.1
        run: python .github/maintenance_v881.py
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testar
        run: |
          python -m py_compile scraper.py tracker.py price_guard.py runner.py tests/test_tracker.py tests/test_price_guard.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.py price_guard.py config/config.json tests/test_price_guard.py
          git commit -m "fix: deduplicar refresh de preço V8.8.1"
          git push origin HEAD:main
