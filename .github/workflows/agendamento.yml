name: Rastreio de Preços a cada 12h
on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install requests beautifulsoup4 playwright && playwright install chromium
      - name: Correr o rastreador
        run: python rastreador.py
