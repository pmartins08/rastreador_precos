name: Maintenance V8.8 Market Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance_v88_market.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Sincronizar main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Aplicar patch
        run: python data/maintenance_v88_market.py
      - name: Instalar dependências e testar
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile scraper.py tracker.py price_guard.py runner.py tests/test_tracker.py tests/test_price_guard.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.py price_guard.py tests/test_tracker.py tests/test_price_guard.py
          git commit -m "feat: confirmar preços por matching exato cross-store V8.8"
          git push origin HEAD:main
