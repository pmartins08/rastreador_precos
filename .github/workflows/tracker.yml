name: Executar Rastreador de Preços

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '.github/workflows/maintenance_*.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rastreador-precos-v883-main
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sincronizar com main atual
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Testes V8 + V8.8.3
        run: |
          python -m py_compile scraper.py brain_guard.py price_guard.py market_guard.py tracker.py runner.py tests/test_brain_guard.py tests/test_tracker.py tests/test_price_guard.py tests/test_market_guard.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validar configuração NTFY
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: test -n "$NTFY_TOPIC"

      - name: Executar Rastreador V8.8.3 adaptativo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_MAX_MINUTES: '8'
          RUN_MAX_REQUESTS: '300'
          RUN_MAX_REQUESTS_PER_STORE: '60'
          RUN_MAX_DETAIL_FETCHES: '90'
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: '1'
        run: python runner.py

      - name: Heartbeat NTFY de falha
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
              -H "Title: ❌ Rastreador V8.8.3 falhou" \
              -H "Priority: high" \
              -H "Tags: warning,computer" \
              -d "GitHub Actions detetou uma falha no pipeline V8.8.3. Consulta a run para identificar o passo que falhou." || true
          fi

      - name: Guardar histórico e aprendizagem
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/history.json data/access_learning.json; then
            echo "Sem alterações de dados."
            exit 0
          fi

          cp data/history.json /tmp/history-v883.json
          cp data/access_learning.json /tmp/access-learning-v883.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python runner.py merge-state \
              --history-current data/history.json \
              --history-run /tmp/history-v883.json \
              --learning-current data/access_learning.json \
              --learning-run /tmp/access-learning-v883.json

            git add data/history.json data/access_learning.json
            if git diff --cached --quiet; then
              echo "Sem alterações após merge com main."
              exit 0
            fi

            git commit -m "chore: atualizar estado V8.8.3 [skip ci]"
            if git push origin HEAD:main; then
              echo "Estado V8.8.3 persistido com sucesso."
              exit 0
            fi

            echo "Push concorrente detetado; nova tentativa ${attempt}/3."
            sleep "$attempt"
          done

          echo "Falha ao persistir estado após 3 tentativas."
          exit 1
