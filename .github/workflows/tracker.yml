name: Executar Rastreador de Preços

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rastreador-precos-main
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sincronizar com main atual
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Testes V8 + V8.4
        run: |
          python -m py_compile scraper.py runner.py runner_v84.py tests/test_v84.py
          SMOKE_TEST=1 python scraper.py
          python -m unittest discover -s tests -v

      - name: Validar configuração NTFY
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: test -n "$NTFY_TOPIC"

      - name: Executar Rastreador V8.4 adaptativo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_MAX_MINUTES: '8'
          RUN_MAX_REQUESTS: '180'
          RUN_MAX_REQUESTS_PER_STORE: '30'
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: '1'
        run: python runner.py

      - name: Guardar histórico e aprendizagem
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/history.json data/access_learning.json; then
            echo "Sem alterações de dados."
            exit 0
          fi

          cp data/history.json /tmp/history-v8.json
          cp data/access_learning.json /tmp/access-learning.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/history-v8.json data/history.json
            cp /tmp/access-learning.json data/access_learning.json
            git add data/history.json data/access_learning.json

            if git diff --cached --quiet; then
              echo "Sem alterações após sincronização com main."
              exit 0
            fi

            git commit -m "chore: atualizar histórico e aprendizagem V8.4 [skip ci]"
            if git push origin HEAD:main; then
              echo "Estado V8.4 persistido com sucesso."
              exit 0
            fi

            echo "Push concorrente detetado; nova tentativa ${attempt}/3."
            sleep "$attempt"
          done

          echo "Falha ao persistir estado após 3 tentativas."
          exit 1
