name: Executar LapIntel V9 beta

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.gitignore'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rastreador-precos-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sincronizar com main atual
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar código, configuração e testes
        run: |
          python -m compileall -q runner.py tracker.py scraper.py version.py src tests scripts
          python -m json.tool config/config.json > /dev/null
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validar configuração NTFY
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: test -n "$NTFY_TOPIC"

      - name: Reparar integridade histórica antes da run
        run: |
          python src/history_integrity_guard.py \
            --history data/history.json \
            --price-history data/price_history.json

      - name: Guardar estado de alertas antes da run
        run: cp data/history.json /tmp/history-before-run.json

      - name: Executar rastreador
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}
          RUN_MAX_MINUTES: '10'
          RUN_MAX_REQUESTS: '420'
          RUN_MAX_REQUESTS_PER_STORE: '60'
          RUN_MAX_DETAIL_FETCHES: '140'
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: '1'
        run: python runner.py

      - name: Validar coerência V9 da run
        run: python scripts/validate_decision_run.py

      - name: Auditar notificações NTFY da run
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/history-before-run.json').read_text(encoding='utf-8'))
          after = json.loads(Path('data/history.json').read_text(encoding='utf-8'))
          before_alerts = before.get('alert_state', {}) if isinstance(before.get('alert_state'), dict) else {}
          after_alerts = after.get('alert_state', {}) if isinstance(after.get('alert_state'), dict) else {}
          changed = {
              key: value
              for key, value in after_alerts.items()
              if isinstance(value, dict) and value != before_alerts.get(key)
          }

          forbidden = []
          for key, value in changed.items():
              base_tier = str(value.get('tier') or '').upper()
              promo_tier = str(value.get('promotion_tier') or '').upper()
              effective_tier = value.get("effective_tier") or promo_tier or base_tier
              if effective_tier != 'DIAMANTE':
                  forbidden.append((key, base_tier or '—', promo_tier or '—'))
          if forbidden:
              raise SystemExit(
                  'ERRO: alertas com tier efetivo diferente de DIAMANTE registados nesta run: '
                  f'{forbidden}'
              )

          runs = (after.get('learning', {}) or {}).get('runs', []) or []
          latest = runs[-1] if runs and isinstance(runs[-1], dict) else {}
          heartbeat = int(bool(latest.get('heartbeat_sent')))
          if heartbeat:
              raise SystemExit("ERRO: heartbeat enviado em modo silencioso")
          opportunities = len(changed)
          total = opportunities + heartbeat
          print(
              f'NTFY nesta run | oportunidades={opportunities} | '
              f'heartbeat={heartbeat} | total={total}'
          )
          PY

      - name: Guardar estado, aprendizagem, histórico e matching
        if: success()
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TRACKED_STATE="data/history.json data/access_learning.json data/price_history.json data/matching_state.json data/state_epoch.json"
          if [ -z "$(git status --porcelain -- $TRACKED_STATE)" ]; then
            echo "Sem alterações de dados."
            exit 0
          fi

          cp data/history.json /tmp/history-run.json
          cp data/access_learning.json /tmp/access-learning-run.json
          cp data/price_history.json /tmp/price-history-run.json
          [ -f data/matching_state.json ] && cp data/matching_state.json /tmp/matching-state-run.json
          [ -f data/state_epoch.json ] && cp data/state_epoch.json /tmp/state-epoch-run.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -f -- data/price_history.json data/matching_state.json data/state_epoch.json

            python runner.py merge-state \
              --history-current data/history.json \
              --history-run /tmp/history-run.json \
              --learning-current data/access_learning.json \
              --learning-run /tmp/access-learning-run.json

            RUN_EPOCH="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/state-epoch-run.json')
          print(json.loads(path.read_text()).get('state_epoch', '') if path.exists() else '')
          PY
          )"
            CURRENT_EPOCH="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/state_epoch.json')
          print(json.loads(path.read_text()).get('state_epoch', '') if path.exists() else '')
          PY
          )"

            if [ -n "$RUN_EPOCH" ] && [ "$RUN_EPOCH" != "$CURRENT_EPOCH" ]; then
              echo "Novo epoch ${RUN_EPOCH}: histórico de preços legado não será reintroduzido."
              cp /tmp/price-history-run.json data/price_history.json
            else
              python src/historical_guard.py \
                --current data/price_history.json \
                --run /tmp/price-history-run.json
            fi

            python src/history_integrity_guard.py \
              --history data/history.json \
              --price-history data/price_history.json

            [ -f /tmp/matching-state-run.json ] && cp /tmp/matching-state-run.json data/matching_state.json
            [ -f /tmp/state-epoch-run.json ] && cp /tmp/state-epoch-run.json data/state_epoch.json

            git add data/history.json data/access_learning.json data/price_history.json data/matching_state.json data/state_epoch.json
            if git diff --cached --quiet; then
              echo "Sem alterações após merge com main."
              exit 0
            fi

            git commit -m "chore: atualizar estado do rastreador [skip ci]"
            if git push origin HEAD:main; then
              echo "Estado persistido com sucesso."
              exit 0
            fi

            echo "Push concorrente detetado; nova tentativa ${attempt}/3."
            sleep "$attempt"
          done

          echo "Falha ao persistir estado após 3 tentativas."
          exit 1
