name: Validar promoções

on:
  push:
    branches: ['v8.8.9-promotion-intelligence']
    paths: ['src/promotion*.py', 'tests/test_promotion*.py', 'scripts/promotion_probe.py', 'scripts/rp_filter_probe.py', 'scripts/promotion_evaluation_probe.py', 'config/config.json', '.github/workflows/promotion-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotion-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      NTFY_TOPIC: ''
      AWIN_DATAFEED_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Radio Popular — testar filtros da campanha
        run: python scripts/rp_filter_probe.py
      - name: Radio Popular — campanha ativa
        run: python scripts/promotion_probe.py --store 'Radio Popular' --output /tmp/rp-promotion.json
      - name: Radio Popular — preços e Value live
        run: python scripts/promotion_evaluation_probe.py --output /tmp/rp-promotion-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-smoke-${{ github.run_id }}
          path: |
            /tmp/rp-promotion.json
            /tmp/rp-promotion-evaluation.json
          retention-days: 14
