name: Diagnosticar acesso PCDiga v4

on:
  push:
    branches: [diag-pcdiga-access-v4]
    paths:
      - '.github/workflows/diag_pcdiga_access_v4.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Seguir robots e sitemaps oficiais PCDiga
        run: |
          python - <<'PY'
          import json,re
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET
          import requests

          h={'User-Agent':'Mozilla/5.0','Accept':'application/xml,text/xml,text/plain,*/*'}
          rr=requests.get('https://www.pcdiga.com/robots.txt',headers=h,timeout=15)
          print('ROBOTS',rr.status_code,rr.url,len(rr.content))
          sitemaps=[]
          for line in rr.text.splitlines():
            if line.lower().startswith('sitemap:'):
              u=line.split(':',1)[1].strip(); sitemaps.append(u); print('DECLARED',u)

          def locs(xml):
            try:
              root=ET.fromstring(xml)
              return [x.text.strip() for x in root.iter() if x.tag.lower().endswith('loc') and x.text]
            except Exception as exc:
              print('XML_ERROR',type(exc).__name__,str(exc)[:200]); return []

          for i,u in enumerate(sitemaps[:8]):
            try:
              r=requests.get(u,headers=h,timeout=15,allow_redirects=True)
              txt=r.text or ''; ls=locs(txt) if r.status_code<400 else []
              print(json.dumps({'level':0,'i':i,'url':u,'status':r.status_code,'final':r.url,'bytes':len(r.content),'locs':len(ls),'cloudflare':'just a moment' in txt.lower()},ensure_ascii=False))
              for x in ls[:20]: print('LOC0',x)
              children=[x for x in ls if x.endswith('.xml') or 'sitemap' in x.lower()]
              for j,c in enumerate(children[:8]):
                cr=requests.get(c,headers=h,timeout=15,allow_redirects=True); ct=cr.text or ''; cls=locs(ct) if cr.status_code<400 else []
                print(json.dumps({'level':1,'parent':i,'j':j,'url':c,'status':cr.status_code,'final':cr.url,'bytes':len(cr.content),'locs':len(cls),'cloudflare':'just a moment' in ct.lower()},ensure_ascii=False))
                productish=[x for x in cls if any(k in x.lower() for k in ('portatil','computadores-portateis','computadores-laptop'))]
                print('PRODUCTISH_COUNT',len(productish))
                for x in productish[:25]: print('PRODUCTISH',x)
            except Exception as exc:
              print('ERROR',u,type(exc).__name__,str(exc)[:300])
          PY
