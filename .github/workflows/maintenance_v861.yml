name: Aplicar V8.6.1

on:
  push:
    branches: [main]
    paths:
      - 'data/maintenance_v861.py'
      - '.github/workflows/maintenance_v861.yml'

permissions:
  contents: write

concurrency:
  group: rastreador-v861-maintenance
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Aplicar refinamentos
        run: python data/maintenance_v861.py

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar V8.6.1
        run: |
          python -m py_compile scraper.py tracker.py tests/test_tracker.py
          python -m unittest discover -s tests -p 'test_tracker.py' -v

      - name: Persistir código V8.6.1
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.py config/config.json tests/test_tracker.py README.md data/maintenance_v861.py
          git commit -m "feat: refinar descoberta e matching V8.6.1 [skip maintenance]"
          git push origin HEAD:main
