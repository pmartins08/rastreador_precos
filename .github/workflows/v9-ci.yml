name: Validar V9

on:
  push:
    branches: [v9/development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar compilação e configuração
        run: |
          python -m compileall -q runner.py tracker.py scraper.py version.py src tests scripts
          python -m json.tool config/config.json > /dev/null

      - name: Executar testes
        run: python -m unittest discover -s tests -p 'test_*.py' -v
