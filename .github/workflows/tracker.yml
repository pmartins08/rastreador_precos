name: Executar Rastreador de Preços

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Aplicar correção definitiva de alertas V8
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scraper.py')
          s = p.read_text(encoding='utf-8')

          # Migração final: preservar VRAM histórica apenas com evidência GDDR explícita.
          old_load = '''    history = load(HISTORY_PATH); history.setdefault("offers", {})\n    for _entries in history["offers"].values():\n        if not isinstance(_entries, list):\n            continue\n        for _entry in _entries:\n            if not isinstance(_entry, dict):\n                continue\n            _spec = _entry.get("specs")\n            if isinstance(_spec, dict):\n                # Migração do bug antigo: RAM nunca deve aparecer como VRAM.\n                if not _spec.get("gpu_modelo") or _spec.get("gpu_tipo") != "dedicada":\n                    _spec["vram_gb"] = None\n    history["schema_version"] = 8\n    all_items: list[dict] = []; loja_stats: dict[str, dict] = {}; errors: dict[str, str | None] = {}'''
          new_load = '''    history = load(HISTORY_PATH); history.setdefault("offers", {})\n    for _entries in history["offers"].values():\n        if not isinstance(_entries, list):\n            continue\n        for _entry in _entries:\n            if not isinstance(_entry, dict):\n                continue\n            _spec = _entry.get("specs")\n            if not isinstance(_spec, dict):\n                continue\n            _ev = _spec.get("evidencias") or {}\n            _raw_vram = str(_ev.get("vram", ""))\n            # Só aceitamos VRAM histórica se houver GDDR explícito na evidência original.\n            if not re.search(r"\\b\\d{1,2}\\s*gb\\s*gddr\\d+\\b", norm(_raw_vram)):\n                _spec["vram_gb"] = None\n    history["schema_version"] = 8\n    history.setdefault("alert_state", {})\n    all_items: list[dict] = []; loja_stats: dict[str, dict] = {}; errors: dict[str, str | None] = {}'''
          if old_load in s:
              s = s.replace(old_load, new_load, 1)

          old_alert = '''        key = f"{loja}::{item['titulo']}"; entries = history["offers"].setdefault(key, [])\n        prev = entries[-1] if entries else None\n        # URL é a identidade mais estável: recupera histórico mesmo que o título tenha mudado.\n        if prev is None:\n            for _old_entries in history["offers"].values():\n                if _old_entries and isinstance(_old_entries[-1], dict) and _old_entries[-1].get("url") == item["url"]:\n                    prev = _old_entries[-1]\n                    break\n        previous_price = prev.get("price") if prev else None\n        previous_value = float(prev.get("value_score", 0)) if prev else 0.0\n        previous_tier = prev.get("tier") if prev else None\n        tier_order = {"BRONZE": 1, "PRATA": 2, "OURO": 3, "DIAMANTE": 4}\n        entry = {"timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"), "price": item["preco"], "stock": item.get("stock"), "score_final": av["score_final"], "score_ranking": av["score_ranking"], "value_score": av["value_score"], "tier": tier, "specs": s, "url": item["url"]}\n        entries.append(entry)\n        if len(entries) > 30: del entries[:-30]\n        if tier and av["value_score"] >= min_value and item.get("stock") is not False:\n            drop_eur = float(settings.get("alerta_queda_preco_eur", 5))\n            price_drop = previous_price is not None and item["preco"] <= previous_price - drop_eur\n            became_opportunity = previous_value < min_value\n            tier_upgrade = bool(previous_tier and tier_order.get(tier, 0) > tier_order.get(previous_tier, 0))\n            first_qualifying = prev is None\n            should_alert = first_qualifying or became_opportunity or tier_upgrade or price_drop\n            if should_alert:\n                alerts += 1\n                if first_qualifying:\n                    reason = "nova oportunidade"\n                elif price_drop:\n                    reason = f"queda de {previous_price - item['preco']:.2f}€"\n                elif tier_upgrade:\n                    reason = f"subida de {previous_tier} para {tier}"\n                else:\n                    reason = "entrou no limiar de alerta"\n                msg = f"{item['titulo']}\\nPreço: {item['preco']:.2f}€\\nValue: {av['value_score']:.1f} | Rank: {av['score_ranking']:.1f}\\nTier: {tier}\\nMotivo: {reason}\\n{item['url']}"\n                enviar_alerta(f"{tier}: {item['titulo']}", msg, "high" if tier in {"DIAMANTE", "OURO"} else "default")'''
          new_alert = '''        key = f"{loja}::{item['titulo']}"; entries = history["offers"].setdefault(key, [])\n        prev = entries[-1] if entries else None\n        # URL é a identidade mais estável: recupera histórico mesmo que o título tenha mudado.\n        if prev is None:\n            for _old_entries in history["offers"].values():\n                if _old_entries and isinstance(_old_entries[-1], dict) and _old_entries[-1].get("url") == item["url"]:\n                    prev = _old_entries[-1]\n                    break\n        previous_price = prev.get("price") if prev else None\n        previous_value = float(prev.get("value_score", 0)) if prev else 0.0\n        previous_tier = prev.get("tier") if prev else None\n        tier_order = {"BRONZE": 1, "PRATA": 2, "OURO": 3, "DIAMANTE": 4}\n        alert_key = f"{loja}::{item['url']}"\n        alert_state = history.setdefault("alert_state", {})\n        prior_alert = alert_state.get(alert_key)\n        entry = {"timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"), "price": item["preco"], "stock": item.get("stock"), "score_final": av["score_final"], "score_ranking": av["score_ranking"], "value_score": av["value_score"], "tier": tier, "specs": s, "url": item["url"]}\n        entries.append(entry)\n        if len(entries) > 30: del entries[:-30]\n        if tier and av["value_score"] >= min_value and item.get("stock") is not False:\n            drop_eur = float(settings.get("alerta_queda_preco_eur", 5))\n            baseline_price = float(prior_alert.get("price")) if prior_alert and prior_alert.get("price") is not None else previous_price\n            baseline_tier = prior_alert.get("tier") if prior_alert else previous_tier\n            price_drop = baseline_price is not None and item["preco"] <= baseline_price - drop_eur\n            became_opportunity = previous_value < min_value\n            tier_upgrade = bool(baseline_tier and tier_order.get(tier, 0) > tier_order.get(baseline_tier, 0))\n            first_alert = prior_alert is None\n            should_alert = first_alert or became_opportunity or tier_upgrade or price_drop\n            if should_alert:\n                alerts += 1\n                if first_alert:\n                    reason = "nova oportunidade / inicialização do alerta"\n                elif price_drop:\n                    reason = f"queda de {baseline_price - item['preco']:.2f}€"\n                elif tier_upgrade:\n                    reason = f"subida de {baseline_tier} para {tier}"\n                else:\n                    reason = "entrou no limiar de alerta"\n                msg = f"{item['titulo']}\\nPreço: {item['preco']:.2f}€\\nValue: {av['value_score']:.1f} | Rank: {av['score_ranking']:.1f}\\nTier: {tier}\\nMotivo: {reason}\\n{item['url']}"\n                enviar_alerta(f"{tier}: {item['titulo']}", msg, "high" if tier in {"DIAMANTE", "OURO"} else "default")\n                alert_state[alert_key] = {"timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"), "price": item["preco"], "value_score": av["value_score"], "tier": tier}'''
          if old_alert in s:
              s = s.replace(old_alert, new_alert, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile scraper.py

      - name: Smoke tests — V8
        env:
          SMOKE_TEST: '1'
        run: |
          python scraper.py
          python - <<'PY'
          from bs4 import BeautifulSoup
          from scraper import extract

          def page(rows):
              html = '<table>' + ''.join(f'<tr><th>{k}</th><td>{v}</td></tr>' for k, v in rows) + '</table>'
              return BeautifulSoup(html, 'html.parser')

          x = extract('Portátil ASUS Zenbook Ryzen AI 7 445 32GB 1TB AMD Graphics', page([('Placa gráfica', 'AMD Radeon Graphics')]))
          assert x['gpu_modelo'] is None, x
          assert x['gpu_tipo'] == 'integrada', x

          x = extract('Portátil ASUS TUF 16 Ryzen 7 260 32GB 1TB RTX 5070', page([('Placa gráfica', 'NVIDIA GeForce RTX 5070 Laptop GPU'), ('Memória gráfica', '8 GB GDDR7'), ('TGP', '115 W')]))
          assert x['gpu_modelo'] == 'rtx 5070', x
          assert x['vram_gb'] == 8, x
          assert x['tgp_w'] == 115, x

          x = extract('Portátil HP 15 i7-1255U 16GB 512GB', page([('Memória RAM', '16 GB DDR4'), ('Armazenamento', '512 GB SSD')]))
          assert x['gpu_modelo'] is None, x
          assert x['vram_gb'] is None, x
          print('OK: anti-contaminacao GPU/VRAM.')
          PY

      - name: Validar configuração NTFY
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: test -n "$NTFY_TOPIC"

      - name: Executar Scraper V8
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scraper.py

      - name: Guardar Histórico
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json scraper.py
          if git diff --cached --quiet; then
            echo "Sem alterações no histórico/código."
            exit 0
          fi
          git commit -m "chore: persistir V8 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push
