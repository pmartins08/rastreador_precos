name: Reparar V8

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar correções V8
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scraper.py')
          s = p.read_text(encoding='utf-8')
          old_block = '''def blocked(r):\n if r.status_code in {401,403,429,503}:return True,f'HTTP {r.status_code}'\n try:t=norm((BeautifulSoup(r.text,'html.parser').title.get_text(' ',strip=True) if BeautifulSoup(r.text,'html.parser').title else '')+' '+r.text[:60000])\n except:t=''\n return next(((True,x) for x in BLOCK if x in t),(False,None))\n'''
          new_block = '''def blocked(r):\n if r.status_code in {401,403,429}:return True,f'HTTP {r.status_code}'\n try:\n  soup=BeautifulSoup(r.text,'html.parser')\n  title=norm(soup.title.get_text(' ',strip=True) if soup.title else '')\n  for n in soup(['script','style','noscript']):n.decompose()\n  visible=norm(' '.join(soup.stripped_strings))[:20000]\n  challenge=('cf-chl-' in title or 'cf-chl-' in visible or 'just a moment' in title or 'checking your browser' in visible or 'verify you are human' in visible or 'access denied' in visible or 'robot check' in visible or 'are you a robot' in visible or 'captcha' in title)\n  return (True,'challenge') if challenge else (False,None)\n except Exception:return False,None\n'''
          if old_block not in s:
              raise SystemExit('Bloco blocked() não encontrado; nenhuma alteração aplicada.')
          s=s.replace(old_block,new_block,1)
          old_vram = "m=re.search(r'(\\d{1,2})\\s*gb',t) if not re.search(r'vram|memoria grafica|graphics memory|video memory',t) else None;o['vram_gb']=int(m.group(1)) if m else None;"
          new_vram = "m=re.search(r'(\\d{1,2})\\s*gb\\s*gddr\\d+',t);o['vram_gb']=int(m.group(1)) if m else None;"
          if old_vram not in s:
              raise SystemExit('Padrão de VRAM não encontrado; nenhuma alteração aplicada.')
          s=s.replace(old_vram,new_vram,1)
          old_print = "[print(f\"🏪 {k}: encontrados={v['encontrados']} candidatos={v['candidatos']} aceites={v['aceites']} rejeitados={v['rejeitados']} bloqueada={v['bloqueada']}\") for k,v in lojas.items()];"
          new_print = "[print(f\"🏪 {k}: encontrados={v['encontrados']} candidatos={v['candidatos']} aceites={v['aceites']} rejeitados={v['rejeitados']} bloqueada={v['bloqueada']}\") for k,v in lojas.items()];"
          s=s.replace(old_print,new_print,1)
          p.write_text(s,encoding='utf-8')
          print('Correções V8 aplicadas.')
          PY

      - name: Validar sintaxe e testes
        run: |
          python -m py_compile scraper.py
          SMOKE_TEST=1 python scraper.py

      - name: Guardar correção e remover manutenção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper.py
          git rm .github/workflows/repair_v8.yml
          git commit -m "fix: evitar falsos bloqueios e inferência errada de VRAM" || exit 0
          git push
