name: Consolidar V8.5

on:
  push:
    branches: [main]
    paths:
      - 'data/maintenance_v85.py'
      - '.github/workflows/maintenance_v85.yml'

permissions:
  contents: write

concurrency:
  group: rastreador-v85-maintenance
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Aplicar consolidação V8.5
        run: python data/maintenance_v85.py

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar versão final antes do commit
        run: |
          python -m py_compile scraper.py tracker.py tests/test_tracker.py
          python -m unittest discover -s tests -p 'test_tracker.py' -v

      - name: Persistir consolidação
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidar V8.5 final [skip maintenance]"
          git push origin HEAD:main
