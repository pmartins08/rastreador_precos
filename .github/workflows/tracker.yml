name: Executar LapIntel V9 beta

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.gitignore'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rastreador-precos-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sincronizar com main atual
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar código, configuração e testes
        run: |
          python -m compileall -q runner.py tracker.py scraper.py version.py src tests scripts
          python -m json.tool config/config.json > /dev/null
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validar configuração NTFY
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: test -n "$NTFY_TOPIC"

      - name: Reparar integridade histórica antes da run
        run: |
          python src/history_integrity_guard.py \
            --history data/history.json \
            --price-history data/price_history.json

      - name: Guardar estado de alertas antes da run
        run: cp data/history.json /tmp/history-before-run.json

      - name: Corrigir resumo solicitado após ajuste do limiar
        if: success() && github.event_name == 'push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/send_top3_summary.py --request-id pedro-v9-beta-2026-09-22-correction

      - name: Executar rastreador
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}
          RUN_MAX_MINUTES: '10'
          RUN_MAX_REQUESTS: '360'
          RUN_MAX_REQUESTS_PER_STORE: '60'
          RUN_MAX_DETAIL_FETCHES: '100'
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: '1'
        run: python runner.py

      - name: Validar coerência V9 da run
        run: python scripts/validate_decision_run.py

      - name: Auditar notificações NTFY da run
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/history-before-run.json').read_text(encoding='utf-8'))
          after = json.loads(Path('data/history.json').read_text(encoding='utf-8'))
          before_alerts = before.get('alert_state', {}) if isinstance(before.get('alert_state'), dict) else {}
          after_alerts = after.get('alert_state', {}) if isinstance(after.get('alert_state'), dict) else {}
          changed = {
              key: value
              for key, value in after_alerts.items()
              if isinstance(value, dict) and value != before_alerts.get(key)
          }

          forbidden = []
          for key, value in changed.items():
              base_tier = str(value.get('tier') or '').upper()
              promo_tier = str(value.get('promotion_tier') or '').upper()
              effective_tier = value.get("effective_tier") or promo_tier or base_tier
              if effective_tier and effective_tier not in {'OURO', 'DIAMANTE'}:
                  forbidden.append((key, base_tier or '—', promo_tier or '—'))
          if forbidden:
              raise SystemExit(
                  'ERRO: alertas com tier efetivo abaixo de OURO registados nesta run: '
                  f'{forbidden}'
              )

          runs = (after.get('learning', {}) or {}).get('runs', []) or []
          latest = runs[-1] if runs and isinstance(runs[-1], dict) else {}
          heartbeat = int(bool(latest.get('heartbeat_sent')))
          opportunities = len(changed)
          total = opportunities + heartbeat
          print(
              f'NTFY nesta run | oportunidades={opportunities} | '
              f'heartbeat={heartbeat} | total={total}'
          )
          PY

      - name: Confirmar publicação NTFY após deploy/manual
        if: success() && github.event_name != 'schedule'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_SHA_SHORT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from curl_cffi import requests
          from version import VERSION

          topic = os.environ.get('NTFY_TOPIC', '').strip()
          if not topic:
              raise SystemExit('NTFY_TOPIC vazio')

          data = json.loads(Path('data/history.json').read_text(encoding='utf-8'))
          run = (data.get('learning', {}).get('runs', []) or [{}])[-1]
          tiers = run.get('tiers', {}) or {}
          stores = run.get('stores', {}) or {}
          healthy = sum(
              1 for value in stores.values()
              if isinstance(value, dict) and value.get('access_status') in {'discovery_available', 'live_available'}
          )
          message = (
              f"Deploy V{run.get('runner_version', VERSION)} confirmado no GitHub Actions.\n"
              f"Lojas: {len(stores)} | acesso útil: {healthy} | "
              f"descobertos: {run.get('total_candidates', '?')} | avaliados: {run.get('total_evaluated', '?')}\n"
              f"D/O/P/B: {tiers.get('DIAMANTE', 0)}/{tiers.get('OURO', 0)}/"
              f"{tiers.get('PRATA', 0)}/{tiers.get('BRONZE', 0)}"
          )
          payload = {
              'topic': topic,
              'title': f'✅ Rastreador operacional V{VERSION}',
              'message': message,
              'priority': 4,
              'tags': ['white_check_mark', 'computer'],
          }
          response = requests.post('https://ntfy.sh', json=payload, timeout=12)
          response.raise_for_status()
          try:
              body = response.json()
          except Exception as exc:
              raise SystemExit(f'NTFY respondeu sem JSON válido: {exc}')
          message_id = str(body.get('id') or '').strip()
          if not message_id:
              raise SystemExit('NTFY aceitou HTTP mas não devolveu id de mensagem')
          print(f'NTFY servidor confirmou publicação | id={message_id} | status={response.status_code}')
          PY

      - name: Garantir heartbeat NTFY
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          APP_VERSION="$(python -c 'from version import VERSION; print(VERSION)')"
          if python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/history.json').read_text(encoding='utf-8'))
          runs = data.get('learning', {}).get('runs', [])
          latest = runs[-1] if runs else {}
          raise SystemExit(0 if latest.get('heartbeat_sent') else 1)
          PY
          then
            echo "Heartbeat principal confirmado pelo tracker."
          else
            echo "Heartbeat principal não chegou; a tentar canal redundante do workflow."
            MESSAGE="$(python - <<'PY'
          import json
          from pathlib import Path
          from version import VERSION

          data = json.loads(Path('data/history.json').read_text(encoding='utf-8'))
          run = (data.get('learning', {}).get('runs', []) or [{}])[-1]
          tiers = run.get('tiers', {})
          print(
              f"V{run.get('runner_version', VERSION)} operacional (heartbeat redundante)\n"
              f"Lojas: {len(run.get('stores', {}))} | descobertos: {run.get('total_candidates', '?')} | "
              f"avaliados: {run.get('total_evaluated', '?')} | aceites: {run.get('total_accepted', '?')}\n"
              f"Pedidos: {run.get('access_requests', '?')} | tempo: {run.get('runtime_seconds', '?')}s\n"
              f"D/O/P/B: {tiers.get('DIAMANTE', 0)}/{tiers.get('OURO', 0)}/{tiers.get('PRATA', 0)}/{tiers.get('BRONZE', 0)}"
          )
          PY
          )"

            sent=0
            for attempt in 1 2 3 4; do
              if curl -fsS --connect-timeout 10 --max-time 20 --retry 1 --retry-delay 2 --retry-all-errors \
                -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
                -H "Title: 💓 Heartbeat Rastreador V${APP_VERSION}" \
                -H "Priority: low" \
                -H "Tags: heartbeat,computer" \
                -d "$MESSAGE"; then
                sent=1
                echo "Heartbeat redundante enviado na tentativa ${attempt}."
                break
              fi
              sleep $((attempt * 2))
            done
            test "$sent" -eq 1
          fi

      - name: Heartbeat NTFY de falha
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          APP_VERSION="$(python -c 'from version import VERSION; print(VERSION)' 2>/dev/null || echo '?')"
          if [ -n "$NTFY_TOPIC" ]; then
            for attempt in 1 2 3 4; do
              if curl -fsS --connect-timeout 10 --max-time 20 --retry 1 --retry-delay 2 --retry-all-errors \
                -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
                -H "Title: ❌ Rastreador V${APP_VERSION} falhou" \
                -H "Priority: high" \
                -H "Tags: warning,computer" \
                -d "GitHub Actions detetou uma falha no pipeline V${APP_VERSION}. Consulta a run para identificar o passo que falhou."; then
                break
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Guardar estado, aprendizagem, histórico e matching
        if: success()
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TRACKED_STATE="data/history.json data/access_learning.json data/price_history.json data/matching_state.json data/state_epoch.json"
          if [ -z "$(git status --porcelain -- $TRACKED_STATE)" ]; then
            echo "Sem alterações de dados."
            exit 0
          fi

          cp data/history.json /tmp/history-run.json
          cp data/access_learning.json /tmp/access-learning-run.json
          cp data/price_history.json /tmp/price-history-run.json
          [ -f data/matching_state.json ] && cp data/matching_state.json /tmp/matching-state-run.json
          [ -f data/state_epoch.json ] && cp data/state_epoch.json /tmp/state-epoch-run.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -f -- data/price_history.json data/matching_state.json data/state_epoch.json

            python runner.py merge-state \
              --history-current data/history.json \
              --history-run /tmp/history-run.json \
              --learning-current data/access_learning.json \
              --learning-run /tmp/access-learning-run.json

            RUN_EPOCH="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/state-epoch-run.json')
          print(json.loads(path.read_text()).get('state_epoch', '') if path.exists() else '')
          PY
          )"
            CURRENT_EPOCH="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/state_epoch.json')
          print(json.loads(path.read_text()).get('state_epoch', '') if path.exists() else '')
          PY
          )"

            if [ -n "$RUN_EPOCH" ] && [ "$RUN_EPOCH" != "$CURRENT_EPOCH" ]; then
              echo "Novo epoch ${RUN_EPOCH}: histórico de preços legado não será reintroduzido."
              cp /tmp/price-history-run.json data/price_history.json
            else
              python src/historical_guard.py \
                --current data/price_history.json \
                --run /tmp/price-history-run.json
            fi

            python src/history_integrity_guard.py \
              --history data/history.json \
              --price-history data/price_history.json

            [ -f /tmp/matching-state-run.json ] && cp /tmp/matching-state-run.json data/matching_state.json
            [ -f /tmp/state-epoch-run.json ] && cp /tmp/state-epoch-run.json data/state_epoch.json

            git add data/history.json data/access_learning.json data/price_history.json data/matching_state.json data/state_epoch.json
            if git diff --cached --quiet; then
              echo "Sem alterações após merge com main."
              exit 0
            fi

            git commit -m "chore: atualizar estado do rastreador [skip ci]"
            if git push origin HEAD:main; then
              echo "Estado persistido com sucesso."
              exit 0
            fi

            echo "Push concorrente detetado; nova tentativa ${attempt}/3."
            sleep "$attempt"
          done

          echo "Falha ao persistir estado após 3 tentativas."
          exit 1

      - name: Enviar Top 3 único solicitado
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/send_top3_summary.py --request-id pedro-v9-beta-2026-09-22
