name: Diagnosticar estrutura pública PCDiga

on:
  push:
    branches: [diag-pcdiga-structure]
    paths:
      - '.github/workflows/diag_pcdiga.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install curl_cffi beautifulsoup4
      - name: Inspecionar HTML e sitemap sem guardar conteúdo
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup
          from curl_cffi import requests

          targets = [
              ('category', 'https://www.pcdiga.com/computadores-e-software/computadores-laptop/computadores-portateis'),
              ('robots', 'https://www.pcdiga.com/robots.txt'),
              ('sitemap-main', 'https://www.pcdiga.com/sitemap/sitemap.xml'),
              ('sitemap-public', 'https://public.pcdiga.com/sitemap/sitemap.xml'),
          ]
          for label, url in targets:
              print(f'\n=== {label} ===')
              try:
                  r = requests.get(url, impersonate='chrome131', timeout=12, allow_redirects=True)
                  print('status', r.status_code, 'final', r.url, 'type', r.headers.get('content-type'), 'bytes', len(r.content))
                  text = r.text or ''
                  if label == 'category':
                      soup = BeautifulSoup(text, 'html.parser')
                      scripts = []
                      for s in soup.find_all('script'):
                          src = s.get('src')
                          if src:
                              scripts.append(urljoin(r.url, src))
                      print('scripts', len(scripts))
                      for src in scripts[:40]:
                          print('SCRIPT', src)
                      hrefs = sorted({urljoin(r.url, a.get('href')) for a in soup.find_all('a', href=True)})
                      productish = [h for h in hrefs if any(x in h.lower() for x in ('portatil-', '/produto/', '/product/'))]
                      print('hrefs', len(hrefs), 'productish', len(productish))
                      for h in productish[:30]: print('LINK', h)
                      for pat in ('algolia','meilisearch','searchspring','graphql','api/','__next_data__','apollo','elastic'):
                          print('MARKER', pat, bool(re.search(re.escape(pat), text, re.I)))
                      # Apenas nomes de chaves/URLs, nunca cookies/tokens.
                      urls = sorted(set(re.findall(r'https?://[^\"\'<>\\\s]+', text)))
                      interesting = [u for u in urls if any(x in u.lower() for x in ('api','search','graphql','algolia','cdn','json'))]
                      for u in interesting[:40]: print('URL', u[:240])
                  else:
                      print((text[:2500]).replace('\r',''))
              except Exception as exc:
                  print('ERROR', type(exc).__name__, str(exc)[:500])
          PY
